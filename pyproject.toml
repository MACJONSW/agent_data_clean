[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-posttrain-pipeline"
version = "0.1.0"
description = "Enterprise-grade Agent post-training data pipeline built on a local Data-Juicer checkout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0"
]

[project.scripts]
agent-posttrain-pipeline = "agent_posttrain_pipeline.cli:main"

[tool.setuptools]
packages = ["agent_posttrain_pipeline", "monitoring"]
